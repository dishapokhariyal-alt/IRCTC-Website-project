    <header>
      <nav>
        <a href="index-irctc.html" target="_self">Home</a>
        <a href="indian_railway_enquiry.html" target="_self"
          >Indian Railways Enquiry</a

          >Reserved Train Between Stations</a

    <main>
      <img
        src="https://www.irctc.co.in/nget/assets/images/secondry-logo.png"
        alt="Indian Railway Logo"
        class="logos"
      />
      <h1>INDIAN RAILWAYS RESERVED TRAIN SCHEDULE</h1>
      <img
        src="https://www.irctc.co.in/nget/assets/images/logo.png"
        alt="IRCTC Logo"
        class="logos"
      />

      <article class="rts_details">
        <h2>Check Reserved Train Schedules here:</h2>

        <form class="user_rts_pnr_details" id="live-status-form">
          <label for="rts-train-number">
            Enter Train Number:
            <input
              required
              type="text"
              name="rts-train-number"
              id="rts-train-number"
              placeholder="eg:12951"
              maxlength="5"
              pattern="[0-9]{5}"
            />
          </label>

          <button type="submit" id="check_status">Check Live Status</button>

          <button type="reset">Reset</button>
        </form>

        <div id="live-status-result"></div>
      </article>
    </main>
    <script src="config.js"></script>
    <script src="rts.js"></script>
  </body>
