<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNR Enquiry</title>
    <link rel="stylesheet" href="pnr_styles.css">
</head>
<body>
    <header>
      <nav>
        <a href="index-irctc.html" target="_self">Home</a>
        <a href="indian_railway_enquiry.html" target="_self"
          >Indian Railways Enquiry</a
        >
        <a href="pnr_enquiry.html" target="_self">PNR Enquiry</a>
        <a href="reserved_train_btw_stations.html" target="_self"
          >Reserved Train Between Stations</a
        >
        <a href="seat_availabilty.html" target="_self">Seat Availability</a>
        <a href="reserved_train_schedule.html" target="_self"
          >Reserved Train Schedule</a
        >
        <a href="fare_enquiry.html" target="_self">Fare Enquiry</a>
      </nav>
    </header>

    <main>
      <img
        src="https://www.irctc.co.in/nget/assets/images/secondry-logo.png"
        alt="Indian Railway Logo"
        class="logos"
      />
      <h1>INDIAN RAILWAYS PNR ENQUIRY</h1>
      <img
        src="https://www.irctc.co.in/nget/assets/images/logo.png"
        alt="IRCTC Logo"
        class="logos"
      />

      <article class="pnr_details">
        <h2>Check your PNR status here:</h2>

        <form action="result_pnr_enquiry.html" class="user_pnr_details">
          <label for="pnr-number"
            >Enter PNR Number:
            <input
              required
              type="text"
              name="pnr-number"
              id="pnr-number"
              placeholder="eg:K9XR2P"
            />
          </label>

          <button type="submit" id="check_status" name="check_status">
            Check Status
          </button>
          <button type="reset">Reset</button>

          <label for="captcha">Enter CAPTCHA:</label><br />

          <div class="captcha-box" id="captchaBox"></div>

          <input
            type="text"
            id="captcha"
            name="captcha"
            placeholder="Enter the code"
          />
          <button type="submit" id="check_captcha" name="check_captcha">
            Check Captcha
          </button>
        </form>
      </article>
    </main>
    <script src="pnr.js"></script>
  </body>
</html>
