<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | Indian Railways</title>
    <link rel="stylesheet" href="auth.css" />
  </head>

  <body>
    <header>
      <nav>
        <div class="nav-links">
          <a href="index-irctc.html">Home</a>
          <a href="indian_railway_enquiry.html">Indian Railways Enquiry</a>
          <a href="pnr_enquiry.html">PNR Enquiry</a>
          <a href="reserved_train_btw_stations.html"
            >Reserved Train Between Stations</a
          >
          <a href="seat_availabilty.html">Seat Availability</a>
          <a href="reserved_train_schedule.html">Reserved Train Schedule</a>
          <a href="fare_enquiry.html">Fare Enquiry</a>
        </div>

        <div class="auth-nav">
          <a href="signup.html">Sign Up</a>
          <a href="login.html">Log In</a>
        </div>
        <div id="auth-nav" class="auth-nav">
          <a href="signup.html">Sign Up</a>
          <a href="login.html">Log In</a>
        </div>
      </nav>
    </header>

    <main class="auth-container">
      <div class="auth-card">
        <h1>Create Your Account</h1>
        <p class="subtitle">Sign up to access your railway account.</p>

        <form id="signup-form">
          <label for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            required
          />

          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />

          <label for="mobile">Mobile Number</label>
          <input
            type="tel"
            id="mobile"
            placeholder="10-digit mobile number"
            maxlength="10"
            required
          />

          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="At least 8 characters"
            minlength="8"
            required
          />

          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Re-enter your password"
            required
          />

          <button type="submit" id="signup-button">Create Account</button>

          <p id="signup-message"></p>
        </form>

        <p class="switch-auth">
          Already have an account?
          <a href="login.html">Log In</a>
        </p>
      </div>
    </main>

   <script src="config.js"></script>
   <script src="auth-nav.js"></script>
   <script src="signup.js"></script>

  </body>
</html>
