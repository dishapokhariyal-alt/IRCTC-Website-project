<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fare Enquiry</title>
    <link rel="stylesheet" href="fare_enquiry_styles.css">
</head>
<body>
    <header>

        <nav>
            <a href="index-irctc.html" target="_self">Home</a>
            <a href="indian_railway_enquiry.html" target="_self">Indian Railways Enquiry</a>
            <a href="pnr_enquiry.html" target="_self">PNR Enquiry</a>
            <a href="reserved_train_btw_stations.html" target="_self">Reserved Train Between Stations</a>
            <a href="seat_availabilty.html" target="_self">Seat Availability</a>
            <a href="reserved_train_schedule.html" target="_self">Reserved Train Schedule</a>
            <a href="fare_enquiry.html" target="_self">Fare Enquiry</a>
            
        </nav>
    </header>

    <main>
        <img src="https://www.irctc.co.in/nget/assets/images/secondry-logo.png" alt="Indian Railway Logo" class="logos">
        <h1>INDIAN RAILWAYS FARE ENQUIRY </h1>
        <img src="https://www.irctc.co.in/nget/assets/images/logo.png" alt="IRCTC Logo" class="logos">
    

        <div class="fa-details">
            <h2>Check the fare details here:</h2>

            <form class="fa-train-details">

                <label for="fa-train-number">Enter Train Number:
                    <input required type="text" name="fa-train-number" id="fa-train-number" placeholder="eg:12951">
                </label>

                <label for="fa-journey-date">Enter Journey Date:
                    <input required type="date" name="fa-journey-date" id="fa-journey-date" placeholder="2026-07-23">
                </label>

                <label for="fa-source-station">Enter Source Station:
                    <input required type="text" name="fa-source-station" id="fa-source-station" placeholder="eg: NDLS ">
                </label>

                <label for="fa-destination-station">Enter Destination Station:
                    <input required type="text" name="fa-destination-station" id="fa-destination-station" placeholder="eg: MMCT ">
                </label>

                <label for="fa-train-class" >Enter Class:
                    <select id="fa-train-class" name="fa-train-class">
                        <option value="all-classes">All Classes</option>
                        <option value="sleeper">Sleeper</option>
                        <option value="3ac">3 AC</option>
                        <option value="2ac">2 AC</option>
                        <option value="1ac">1 AC</option>
                    </select>
                </label>

                <label for="fa-train-quota" >Enter Quota:
                    <select id="fa-train-quota" name="fa-train-quota">
                        <option value="general">General</option>
                        <option value="ladies">Ladies</option>
                        <option value="sr-citizen">Lower Berth/Sr.Citizen</option>
                        <option value="duty-pass">Duty Pass</option>
                        <option value="tatkal">Tatakl</option>
                        <option value="prem-tatkal">Premium Tatakl</option>
                    </select>
                </label>

                <label for="fa-passenger-type" >Passenger Type:
                    <select id="fa-passenger-type" name="fa-passenger-type">
                        <option value="adult">Adult</option>
                        <option value="child">Child</option>
                    </select>
                </label>
            </form>
            <button type="submit" id="fa-check-avail" class="fa-check-avail">Check Fare</button>
            <button type="reset" id="fa-reset" name="fa-reset">Reset</button>
        </div>
    
</body>
</html>
